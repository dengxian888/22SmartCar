# M5-3 终端可切换模型清单与参数阈值
models:
  - name: "default"
    path: "/models/default.engine"
    description: "基础 YOLOv5 感知模型"
  - name: "v3"
    path: "/models/best_v3.engine"
    description: "升级版 YOLOv8 模型"
